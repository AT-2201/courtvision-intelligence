[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courtvision-intelligence"
version = "0.2.0"
description = "Basketball analytics and scouting portfolio platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]
kaggle = ["kagglehub>=0.3,<1"]
warehouse = ["dbt-postgres>=1.8,<2"]

[project.scripts]
courtvision = "courtvision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/courtvision"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

