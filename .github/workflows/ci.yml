name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Lint Python
        run: ruff check .
      - name: Test Python
        run: pytest
      - name: Validate frontend JavaScript
        run: node --check dist/assets/app.js
