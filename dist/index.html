<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CourtVision Intelligence — basketball analytics and scouting portfolio platform.">
    <title>CourtVision Intelligence</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css?v=2">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="CourtVision Intelligence home">
          <span class="brand-mark">CV</span>
          <span><strong>CourtVision</strong><small>INTELLIGENCE</small></span>
        </a>
        <nav id="primary-nav" aria-label="Primary navigation"></nav>
        <div class="source-card">
          <span class="source-status"><i></i> DATA CONNECTED</span>
          <strong>2023/24 regular season</strong>
          <span>30 teams · 1,230 games</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <span class="eyebrow" id="page-kicker">LEAGUE INTELLIGENCE</span>
            <h1 id="page-title">League pulse</h1>
          </div>
          <div class="top-actions">
            <button class="command-button" id="command-button" aria-label="Open quick navigation"><span>⌕</span> Quick find <kbd>/</kbd></button>
            <div class="season-badge"><span></span> 2023/24</div>
          </div>
        </header>
        <div id="page-root" class="page-root" aria-live="polite"></div>
      </main>
    </div>
    <div class="command-palette" id="command-palette" hidden>
      <button class="palette-backdrop" data-close-palette aria-label="Close quick navigation"></button>
      <div class="palette-dialog" role="dialog" aria-modal="true" aria-label="Quick navigation">
        <div class="palette-search"><span>⌕</span><input id="palette-input" placeholder="Search a page, player or team…" autocomplete="off"><kbd>ESC</kbd></div>
        <div id="palette-results" class="palette-results"></div>
      </div>
    </div>
    <script src="assets/data.js?v=3"></script>
    <script src="assets/app.js?v=3"></script>
  </body>
</html>
