<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CourtVision Intelligence — basketball analytics and scouting portfolio platform.">
    <title>CourtVision Intelligence</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css?v=9">
  </head>
  <body>
    <div class="utility-bar">
      <span>COURTVISION / BASKETBALL INTELLIGENCE</span>
      <span class="utility-status"><i></i><strong id="data-layer">Connecting data layer…</strong></span>
    </div>
    <header class="site-header">
      <a class="brand" href="#overview" aria-label="CourtVision Intelligence home">
        <span class="brand-mark">CV</span>
        <span><strong>CourtVision</strong><small>INTELLIGENCE</small></span>
      </a>
      <nav id="primary-nav" aria-label="Primary navigation"></nav>
      <div class="header-actions">
        <button class="command-button" id="command-button" aria-label="Open quick navigation"><span>⌕</span><em>Search</em><kbd>/</kbd></button>
        <div class="season-badge"><span></span> 2023/24</div>
      </div>
    </header>
    <section class="score-ribbon" aria-label="Latest game results">
      <div class="score-ribbon-track" id="score-ribbon"></div>
      <button class="all-games-button" data-go="games">View all games <span>→</span></button>
    </section>
    <main>
      <header class="page-heading">
        <div>
          <span class="eyebrow" id="page-kicker">LEAGUE INTELLIGENCE</span>
          <h1 id="page-title">League pulse</h1>
        </div>
      </header>
      <div id="page-root" class="page-root" aria-live="polite"></div>
    </main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="#overview"><span class="brand-mark">CV</span><span><strong>CourtVision</strong><small>INTELLIGENCE</small></span></a>
      <p>Built as a portfolio project for basketball data engineering and analytics.</p>
      <span>2023/24 REGULAR SEASON · 1,230 GAMES</span>
    </footer>
    <div class="command-palette" id="command-palette" hidden>
      <button class="palette-backdrop" data-close-palette aria-label="Close quick navigation"></button>
      <div class="palette-dialog" role="dialog" aria-modal="true" aria-label="Quick navigation">
        <div class="palette-search"><span>⌕</span><input id="palette-input" placeholder="Search a page, player or team…" autocomplete="off"><kbd>ESC</kbd></div>
        <div id="palette-results" class="palette-results"></div>
      </div>
    </div>
    <script src="assets/data.js?v=4"></script>
    <script src="assets/app.js?v=10"></script>
  </body>
</html>
