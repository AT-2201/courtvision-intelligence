services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courtvision
      POSTGRES_USER: courtvision
      POSTGRES_PASSWORD: courtvision
    ports:
      - "5433:5432"
    volumes:
      - courtvision_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  courtvision_postgres:

